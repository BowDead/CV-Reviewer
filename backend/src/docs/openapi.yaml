components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cvr_session
      description: Token JWT ustawiany przy logowaniu i rejestracji

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferKey:
      name: offerKey
      in: path
      required: true
      description: "`jobOfferKey` oferty z Solid.Jobs"
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Niepoprawne dane wejściowe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: INVALID_INPUT
    Unauthorized:
      description: "`AUTH_REQUIRED` – brak sesji, `SESSION_EXPIRED` – sesja wygasła"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: AUTH_REQUIRED
    Forbidden:
      description: "`FORBIDDEN` – rola użytkownika nie ma dostępu"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: FORBIDDEN
    NotFound:
      description: Nie znaleziono zasobu albo należy on do innego użytkownika
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Kod błędu tłumaczony przez frontend
          example: FILE_TOO_LARGE
        params:
          type: object
          description: Wartości wstawiane do komunikatu
          additionalProperties: true
          example:
            maxMb: 10

    Role:
      type: string
      enum: [candidate, employer, admin]

    Seniority:
      type: string
      enum: [Stażysta, Junior, Mid, Senior, Lead]

    SkillStatus:
      type: string
      enum: [approved, pending, rejected]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        role:
          type: string
          enum: [candidate, employer]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LlmKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
