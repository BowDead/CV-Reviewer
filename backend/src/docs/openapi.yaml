openapi: 3.1.0
info:
  title: CV Reviewer API
  version: 1.0.0
  description: |
    REST API aplikacji CV Reviewer: analiza CV przez model językowy, repozytoria GitHub, oferty pracy oraz strona pracodawcy i administratora.

    Sesja jest przechowywana w ciasteczku `cvr_session` (httpOnly), ustawianym przy logowaniu i rejestracji.

    Błąd ma postać `{ "error": "KOD", "params": { … } }`. Komunikat dla użytkownika dobiera frontend na podstawie kodu.

tags:
  - name: CV i analizy
    description: "Dostęp: kandydat, administrator"
  - name: Stan serwera
  - name: Konto i sesja
  - name: Klucze do modelu językowego
  - name: CV i analizy
  - name: Słownik umiejętności
  - name: Repozytoria GitHub
  - name: Oferty pracy
  - name: Profil kandydata
    description: "Dostęp: kandydat, administrator"
  - name: Zaproszenia
    description: "Dostęp: kandydat, administrator"
  - name: Stanowiska i kandydaci
    description: "Dostęp: pracodawca, administrator"
  - name: Administracja
    description: "Dostęp: administrator"

security:
  - cookieAuth: []

paths:
  /api/health:
    get:
      tags: [Stan serwera]
      summary: Sprawdzanie działania serwera i połączenia z bazą
      security: []
      responses:
        "200":
          description: Serwer działa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  databaseConnected:
                    type: boolean

  /api/auth/register:
    post:
      tags: [Konto i sesja]
      summary: Rejestracja konta z wybraną rolą użytkownika
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Konto utworzone, ustawione ciasteczko sesji
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "`EMAIL_REQUIRED`, `EMAIL_INVALID`, `EMAIL_TOO_LONG`, `PASSWORD_REQUIRED`, `PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`, `ROLE_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`EMAIL_TAKEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags: [Konto i sesja]
      summary: Logowanie oraz ustawianie ciasteczka sesji
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Zalogowano, ustawione ciasteczko sesji
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "`INVALID_CREDENTIALS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      tags: [Konto i sesja]
      summary: Wylogowanie oraz usunięcie ciasteczka sesji
      security: []
      responses:
        "204":
          description: Wylogowano

  /api/auth/me:
    get:
      tags: [Konto i sesja]
      summary: Pobieranie danych zalogowanego użytkownika
      responses:
        "200":
          description: Dane użytkownika
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Konto i sesja]
      summary: Usunięcie konta użytkownika i jego danych
      description: Usuwa konto i wszystkie dane użytkownika. Razem z kontem znika klucz danych, więc zaszyfrowane dane stają się nieczytelne.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        "204":
          description: Konto usunięte, ciasteczko sesji usunięte
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/llm-keys:
    get:
      tags: [Klucze do modelu językowego]
      summary: Lista kluczy API użytkownika do modeli językowych oraz dostępnych dostawców
      description: Wartości kluczy nie są zwracane.
      responses:
        "200":
          description: Klucze w kolejności priorytetu i obsługiwani dostawcy
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/LlmKey"
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Klucze do modelu językowego]
      summary: Sprawdzanie klucza u dostawcy i zapisanie go
      description: Klucz jest sprawdzany krótkim zapytaniem do dostawcy, a potem zapisywany w postaci zaszyfrowanej.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmKeyInput"
      responses:
        "201":
          description: Klucz zapisany
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: "#/components/schemas/LlmKey"
        "400":
          description: "`PROVIDER_REQUIRED`, `MODEL_REQUIRED`, `MODEL_TOO_LONG`, `LLM_KEY_LABEL_TOO_LONG`, `API_KEY_REQUIRED`, `API_KEY_TOO_LONG`, `API_KEY_INVALID_CHARS`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`LLM_KEY_LIMIT`, `LLM_KEY_SAVE_FAILED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`AI_KEY_INVALID`, `AI_MODEL_UNAVAILABLE`, `PROVIDER_UNSUPPORTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/llm-keys/order:
    put:
      tags: [Klucze do modelu językowego]
      summary: Zmiana kolejności kluczy
      description: Pierwszy klucz na liście jest używany domyślnie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  description: Identyfikatory wszystkich kluczy użytkownika w nowej kolejności
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Klucze w nowej kolejności
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/LlmKey"
        "400":
          description: "`LLM_KEY_ORDER_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/llm-keys/{id}:
    delete:
      tags: [Klucze do modelu językowego]
      summary: Usunięcie klucza
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Klucz usunięty
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/cv/parse:
    post:
      tags: [CV i analizy]
      summary: Odczyt tekstu z pliku PDF lub DOCX
      description: Plik nie jest zapisywany.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CvUpload"
      responses:
        "200":
          description: Tekst odczytany z pliku
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedCv"
        "400":
          description: "`FILE_MISSING`, `FILE_EMPTY`, `FILE_NOT_PDF`, `FILE_NOT_DOCX`, `FILE_UNREADABLE`, `UPLOAD_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "`FILE_TOO_LARGE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`FILE_UNSUPPORTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`FILE_NO_TEXT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cv/anonymize:
    post:
      tags: [CV i analizy]
      summary: Anonimizacja tekstu CV przez system
      description: Dzieli tekst na fragmenty zwykłe i ukryte (typ danych i etykieta). Użytkownik może przed analizą odkryć ukryty fragment albo ukryć kolejny.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvTextRequest"
      responses:
        "200":
          description: Tekst podzielony na fragmenty
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Segment"
        "400":
          description: "`CV_TEXT_MISSING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "`CV_TEXT_TOO_LONG`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cv/analyze:
    post:
      tags: [CV i analizy]
      summary: Analiza tekstu CV przez model językowy
      description: Analizuje tekst zanonimizowany i zatwierdzony przez użytkownika. Wynik jest zapisywany w historii analiz.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CvTextRequest"
                - type: object
                  properties:
                    cvFileId:
                      type: [string, "null"]
                      format: uuid
                      description: Zapisane CV, z którego pochodzi tekst. Nieznany identyfikator jest pomijany.
                    fileName:
                      type: [string, "null"]
                      maxLength: 255
                      description: Nazwa pliku pokazywana w historii analiz
      responses:
        "200":
          description: Wynik analizy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: "`CV_TEXT_MISSING`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`LLM_KEY_REQUIRED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`CV_TEXT_TOO_LONG`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`AI_KEY_INVALID`, `AI_MODEL_UNAVAILABLE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`AI_RATE_LIMIT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "`AI_CONNECTION`, `AI_EMPTY_RESPONSE`, `AI_INVALID_RESPONSE`, `AI_PROVIDER_ERROR`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: "`AI_TIMEOUT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cv/files:
    get:
      tags: [CV i analizy]
      summary: Lista zapisanych CV
      responses:
        "200":
          description: Zapisane CV, od najnowszego
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/CvFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [CV i analizy]
      summary: Zapisanie przesłanego pliku CV za zgodą użytkownika
      description: Plik jest najpierw odczytywany tak jak w `/api/cv/parse`, więc zapisany zostanie tylko poprawny PDF lub DOCX z tekstem. Plik i jego nazwa są szyfrowane kluczem danych użytkownika.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CvUpload"
      responses:
        "201":
          description: CV zapisane
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    $ref: "#/components/schemas/CvFile"
        "400":
          description: "`FILE_MISSING`, `FILE_EMPTY`, `FILE_NOT_PDF`, `FILE_NOT_DOCX`, `FILE_UNREADABLE`, `UPLOAD_INVALID`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`CV_FILE_LIMIT` – zapisano już najwięcej plików"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "`FILE_TOO_LARGE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`FILE_UNSUPPORTED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`FILE_NO_TEXT`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cv/files/creator:
    post:
      tags: [CV i analizy]
      summary: Zapisanie CV utworzonego w kreatorze
      description: Na podstawie danych z kreatora powstaje plik CV, zapisywany tak jak przesłany plik.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvCreatorInput"
      responses:
        "201":
          description: CV utworzone i zapisane
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    $ref: "#/components/schemas/CvFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/cv/files/{id}/content:
    get:
      tags: [CV i analizy]
      summary: Pobranie odszyfrowanego pliku CV
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Zawartość pliku
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CV_FILE_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/cv/files/{id}:
    delete:
      tags: [CV i analizy]
      summary: Usunięcie zapisanego CV
      description: Analizy tego CV zostają w historii. Pracodawca traci dostęp do CV udostępnionego w zaproszeniu.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: CV usunięte
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`CV_FILE_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/analyses:
    get:
      tags: [CV i analizy]
      summary: Historia analiz CV
      description: Każda analiza z `/api/cv/analyze` trafia tu automatycznie. Lista nie zawiera pełnego wyniku.
      responses:
        "200":
          description: Analizy użytkownika, od najnowszej
          content:
            application/json:
              schema:
                type: object
                properties:
                  analyses:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalysisSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/analyses/{id}:
    get:
      tags: [CV i analizy]
      summary: Wynik wybranej analizy
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Analiza z pełnym wynikiem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`ANALYSIS_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [CV i analizy]
      summary: Usunięcie wybranej analizy
      description: Nie można usunąć analizy, która jest źródłem profilu kandydata.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Analiza usunięta
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`ANALYSIS_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`ANALYSIS_IS_PROFILE_SOURCE` – analiza jest źródłem profilu kandydata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/skills:
    get:
      tags: [Słownik umiejętności]
      summary: Lista zatwierdzonych umiejętności
      description: Służy np. do filtrów wyszukiwania i formularzy.
      responses:
        "200":
          description: Zatwierdzone umiejętności
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/github/account:
    put:
      tags: [Repozytoria GitHub]
      summary: Podanie loginu lub zmiana loginu GitHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login:
                  type: string
                  maxLength: 39
                  example: octocat
      responses:
        "200":
          description: Login zapisany
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Konto GitHub nie istnieje
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Repozytoria GitHub]
      summary: Usunięcie loginu GitHub i danych repozytoriów
      responses:
        "204":
          description: Login i dane repozytoriów usunięte
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/github/repositories:
    get:
      tags: [Repozytoria GitHub]
      summary: Lista repozytoriów ze stanem analizy i listą umiejętności
      responses:
        "200":
          description: Repozytoria użytkownika
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/github/repositories/analyze:
    post:
      tags: [Repozytoria GitHub]
      summary: Aktualizacja danych i analiza repozytoriów
      description: Pobiera listę publicznych repozytoriów z GitHuba i analizuje tylko te, które są nowe albo zmieniły się od ostatniej analizy. Forki i puste repozytoria są pomijane.
      responses:
        "200":
          description: Podsumowanie analizy i aktualna lista repozytoriów
          content:
            application/json:
              schema:
                type: object
                properties:
                  analyzed:
                    type: integer
                  unchanged:
                    type: integer
                  failed:
                    type: integer
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Nie podano loginu GitHub albo brak klucza do modelu (`LLM_KEY_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Błąd GitHub API albo modelu językowego
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/offers:
    get:
      tags: [Oferty pracy]
      summary: Lista ofert z Solid.Jobs
      description: Kolejność ustala system na podstawie pokrycia umiejętności oferty umiejętnościami z analizy i repozytoriów.
      parameters:
        - name: analysisId
          in: query
          description: Analiza, do której dopasowywane są oferty. Domyślnie analiza źródłowa profilu.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Oferty od najlepiej dopasowanej
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Offer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Błąd Solid.Jobs API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/offers/{offerKey}/insight:
    post:
      tags: [Oferty pracy]
      summary: Zwrócenie zapisanego uzasadnienia lub wygenerowanie uzasadnienia dla nowej oferty
      description: Zwraca zapisane uzasadnienie albo generuje je przez model, jeśli go nie ma lub oferta zmieniła się później.
      parameters:
        - $ref: "#/components/parameters/OfferKey"
      requestBody:
        required: true
