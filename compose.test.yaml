name: cv-reviewer-test

services:
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: cvreviewer
      POSTGRES_PASSWORD: cvreviewer
      POSTGRES_DB: cvreviewer_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U cvreviewer -d cvreviewer_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
